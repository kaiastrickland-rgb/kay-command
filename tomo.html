<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KAY // COMMAND — Tomo Accountability</title>
<style>
:root{--bg:#061018;--panel:#0b1720;--panel2:#08151d;--line:#284654;--text:#f7f8fa;--muted:#94a8b5;--cyan:#45d9ff;--green:#47eca1;--red:#ff7a84;--amber:#ffca62}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.shell{max-width:1100px;margin:0 auto;padding:20px}
h1{font-size:30px;margin:0 0 6px}.sub{color:var(--muted);margin-bottom:18px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pill{border:1px solid var(--line);border-radius:999px;padding:9px 12px;font-size:13px}.pill b{color:var(--green)}
.card,.project{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:16px;margin-bottom:14px}
.projectTop{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.projectName{font-size:21px;font-weight:900}.meta{color:var(--muted);font-size:13px;margin-top:5px;line-height:1.4}
.nextMove{margin-top:10px;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:11px}
.planBox{margin-top:12px;padding:12px;border-left:3px solid var(--cyan);background:var(--panel2);border-radius:10px}
.taskList{display:grid;gap:8px;margin-top:12px}
.taskRow{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:11px}
.taskHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.taskName{font-weight:820;font-size:16px}.overdue{color:var(--red);font-weight:800}.planTag{color:var(--cyan);font-weight:800}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button,input,textarea,select{font:inherit}
button{border:1px solid var(--line);background:#0c202a;color:var(--text);border-radius:10px;padding:9px 11px;cursor:pointer}
button.primary{background:#125972;border-color:#1b92b6;font-weight:800}
input,textarea,select{width:100%;background:#08151d;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:16px}
textarea{min-height:85px;resize:vertical}.auth{max-width:520px;margin:60px auto;border:1px solid var(--line);background:var(--panel);padding:22px;border-radius:18px}
.auth button{width:100%;margin-top:10px}.hidden{display:none}.editor{margin-top:10px;display:grid;gap:8px}.status{min-height:24px;color:var(--muted);font-size:13px;margin:8px 0 16px}
.createGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.createGrid .wide{grid-column:1/-1}
.sectionTitle{font-size:13px;font-weight:900;letter-spacing:.08em;color:var(--cyan);margin-top:14px}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
.workoutPanel{margin-top:12px;border:1px solid #2a5b60;background:#0c2228;border-radius:12px;padding:12px}
.workoutPanel summary{cursor:pointer;color:var(--green);font-weight:800}
.exercise{padding:12px 0;border-bottom:1px solid var(--line)}
.exercise:last-child{border-bottom:0}
.exercise h4{margin:0 0 7px;font-size:15px}.workoutLine{white-space:pre-wrap;line-height:1.5}
.setGrid{display:grid;grid-template-columns:minmax(70px,1fr) repeat(4,minmax(60px,1fr)) auto;gap:6px;margin:7px 0;align-items:end}
.setGrid input{padding:7px;font-size:14px;min-width:0}.setGrid label{font-size:11px;color:var(--muted)}
.setGrid button{font-size:13px;white-space:nowrap}.savedSet{color:var(--green);font-size:12px}
@media(max-width:650px){.setGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.setGrid>div:first-child{grid-column:1/-1}.setGrid button{grid-column:1/-1}}

@media(max-width:650px){.shell{padding:12px}.projectTop,.taskHead{display:block}.taskHead button{margin-top:8px}.createGrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <main id="app">
    <h1>KAY // COMMAND — Tomo View</h1>
    <div class="sub">Projects, formal plans, and live Action Center tasks — read and update without signing in.</div>
    <div id="summary" class="bar"></div>

    <section class="card" id="mission" aria-label="Daily priorities"></section>

    <section class="card">
      <div class="projectName">➕ Create a live task</div>
      <div class="meta">New tasks go into Action Center under an existing project. Duplicate open tasks are blocked.</div>
      <div class="createGrid" style="margin-top:12px">
        <div class="wide"><label class="meta">Task name</label><input id="newName" placeholder="What needs to be done?"></div>
        <div><label class="meta">Project</label><select id="newProject"></select></div>
        <div><label class="meta">Due date</label><input id="newDate" type="date"></div>
        <div class="wide"><label class="meta">Details</label><textarea id="newDetails" placeholder="Optional details"></textarea></div>
      </div>
      <div class="actions"><button id="createTask" class="primary">Create task</button></div>
    </section>

    <div class="bar">
      <button id="refresh">↻ Refresh projects</button>
      
    </div>
    <div id="status" class="status"></div>
    <div id="projects"></div>
  </main>
</div>


<script>
const API='/api/tomo-tasks'; const $=id=>document.getElementById(id); let FEED=null;
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(d){if(!d)return'No due date';const[y,m,day]=d.split('-').map(Number);return new Date(y,m-1,day).toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'})}
async function callApi(method='GET',body){
  const r=await fetch(API,{
    method,
    cache:'no-store',
    headers:{'Content-Type':'application/json'},
    body:body?JSON.stringify(body):undefined
  });
  const data=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(data.error||'Request failed ('+r.status+')');e.data=data;throw e;}
  return data;
}
function setStatus(m){$('status').textContent=m}
function taskHtml(t){
 const tag=t.task_type==='plan'?'<span class="planTag">PROJECT PLAN</span>':'<span class="planTag">LIVE TASK</span>';
 return `<div class="taskRow">
  <div class="taskHead">
   <div><div class="taskName">${esc(t.task)}</div><div class="meta">${tag} · ${fmtDate(t.due_date)}${t.owner?' · '+esc(t.owner):''}${t.overdue?'<span class="overdue"> · OVERDUE</span>':''}${t.phase?' · '+esc(t.phase):''}${t.priority?' · '+esc(t.priority):''}</div></div>
   <button class="primary" data-action="complete" data-type="${t.task_type}" data-id="${t.id}">✓ Complete</button>
  </div>
  ${/^BFL W\d{2} — /.test(t.task)?`<details class="workoutPanel" data-workout-id="${t.id}"><summary>💪 Full workout • sets, reps, rests & weight log</summary><div class="workoutBody" id="workout-${t.id}"><button data-load-workout="${t.id}">Load workout and recorded sets</button></div></details>`:(t.details?`<div class="meta" style="margin-top:8px;white-space:pre-wrap">${esc(t.details)}</div>`:'')}
  <div class="actions"><button data-edit="${t.task_type}:${t.id}">Update / reschedule</button></div>
  <div id="edit-${t.task_type}-${t.id}" class="editor hidden">
   <label class="meta">Due date</label><input id="date-${t.task_type}-${t.id}" type="date" value="${t.due_date||''}">
   <label class="meta">Details</label><textarea id="details-${t.task_type}-${t.id}">${esc(t.details||'')}</textarea>
   <div class="actions"><button class="primary" data-save-date="${t.task_type}:${t.id}">Save due date</button><button data-save-details="${t.task_type}:${t.id}">Save details</button></div>
  </div>
 </div>`;
}
function render(){
 const s=FEED.summary;
 const active=FEED.projects.filter(p=>p.status!=='Closed');
 const archived=FEED.projects.filter(p=>p.status==='Closed');
 const reset=active.find(p=>p.name==='Kay 2.0 — 30-Day Reset');
 const daily=(reset?.open_live_tasks||[]).filter(t=>/^DAY [0-9]+ —/.test(t.task)).sort((a,b)=>{
   const dateOrder=(a.due_date||'9999-12-31').localeCompare(b.due_date||'9999-12-31');
   if(dateOrder) return dateOrder;
   const rank=t=>t.task.includes('— BODY:')?0:t.task.includes('— SPACE:')?1:t.task.includes('— FUTURE:')?2:3;
   return rank(a)-rank(b);
 }).slice(0,3);
 const missionDate=daily[0]?.due_date?'Target date: '+fmtDate(daily[0].due_date)+' · ':'';
 $('mission').innerHTML='<div class="projectName">🎯 Next three wins</div><div class="meta">'+missionDate+'Small, checkable actions. Complete each without closing monthly milestones.</div><div class="taskList">'+(daily.length?daily.map(taskHtml).join(''):'<div class="empty">No daily actions assigned yet. Tomo can add the next three tasks here.</div>')+'</div>';
 $('summary').innerHTML=[['Projects',s.projects],['Open live tasks',s.open_live_tasks],['Open plan tasks',s.open_plan_tasks],['Overdue',s.overdue],['Due today',s.due_today],['Archived',s.archived_projects||0]].map(([a,b])=>`<span class="pill">${a}: <b>${b}</b></span>`).join('');
 $('newProject').innerHTML=active.map(p=>`<option value="${p.id}">${esc(p.name)}${p.workspace?' · '+esc(p.workspace):''}</option>`).join('');

 const projectHtml=p=>`
  <section class="project">
   <div class="projectTop">
    <div>
     <div class="projectName">📁 ${esc(p.name)}</div>
     <div class="meta">${esc(p.workspace||'Uncategorized')}${p.target_date?' · target '+fmtDate(p.target_date):''} · ${p.counts.live_open} live open · ${p.counts.plan_open} plan open</div>
    </div>
   </div>
   ${p.next_move?`<div class="nextMove"><b>Next move</b><div class="meta">${esc(p.next_move)}</div></div>`:''}
   ${p.plans.length?p.plans.map(pl=>`<div class="planBox"><b>${esc(pl.name)}</b>${pl.summary?`<div class="meta">${esc(pl.summary)}</div>`:''}${pl.source_name?`<div class="meta">Source: ${esc(pl.source_name)}</div>`:''}</div>`).join(''):''}
   <div class="sectionTitle">LIVE / ACTION CENTER TASKS</div>
   <div class="taskList">${p.open_live_tasks.length?p.open_live_tasks.filter(t=>!t.task.startsWith('DAY 2 —')).map(taskHtml).join(''):'<div class="empty">No open live tasks.</div>'}</div>
   <div class="sectionTitle">FORMAL PROJECT PLAN — TASKS STILL TO COMPLETE</div>
   <div class="taskList">${p.open_plan_tasks.length?p.open_plan_tasks.map(taskHtml).join(''):'<div class="empty">No remaining formal plan tasks.</div>'}</div>
  </section>`;
 $('projects').innerHTML=active.map(projectHtml).join('')+(archived.length?'<details class="card"><summary style="cursor:pointer;font-weight:800">Archived events ('+archived.length+') — click to review history</summary>'+archived.map(projectHtml).join('')+'</details>':'');

 document.querySelectorAll('[data-workout-id]').forEach(el=>el.addEventListener('toggle',()=>{if(el.open&&!el.dataset.loaded){el.dataset.loaded='yes';loadWorkout(el.dataset.workoutId);}}));
 document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>runAction(b.dataset.id,b.dataset.type,b.dataset.action)));
 document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>{const [type,id]=b.dataset.edit.split(':');$(`edit-${type}-${id}`).classList.toggle('hidden')}));
 document.querySelectorAll('[data-save-date]').forEach(b=>b.addEventListener('click',()=>{const [type,id]=b.dataset.saveDate.split(':');const due=$(`date-${type}-${id}`).value;if(!due)return setStatus('Choose a due date first.');runAction(id,type,'reschedule',{due_date:due})}));
 document.querySelectorAll('[data-save-details]').forEach(b=>b.addEventListener('click',()=>{const [type,id]=b.dataset.saveDetails.split(':');runAction(id,type,'update_details',{details:$(`details-${type}-${id}`).value})}));
}
const WORKOUT_API='/api/tomo-workouts';
const asNumber=v=>v===null||v===undefined?'':String(v);
async function loadWorkout(taskId){
 const el=$('workout-'+taskId);
 if(!el)return;
 el.textContent='Loading your exercise prescription and existing logs…';
 try{
  const r=await fetch(WORKOUT_API+'?task_id='+encodeURIComponent(taskId),{cache:'no-store'});
  const data=await r.json();
  if(!r.ok)throw Error(data.error||'Workout unavailable');
  renderWorkout(taskId,data);
 }catch(e){el.textContent=e.message;}
}
function renderWorkout(taskId,data){
 const el=$('workout-'+taskId),p=data.plan;
 const saved=new Map(data.sets.map(x=>[x.exercise+'|'+x.set_number,x]));
 const input=(exerciseIndex,set,field,value,placeholder)=>`<div><label>${field==='weight_lb'?'Weight (lb)':field==='reps'?'Actual reps':field==='duration_minutes'?'Minutes':field==='rpe'?'RPE (1–10)':'Notes'}</label><input data-field="${field}" type="${field==='notes'?'text':'number'}" ${field==='notes'?'maxlength="1000"':'step="any" min="0"'} value="${esc(asNumber(value))}" placeholder="${esc(placeholder||'')}" aria-label="${field} for set ${set}"></div>`;
 el.innerHTML=`<div class="meta">Week ${p.week} · ${esc(p.category)} · ${fmtDate(p.due_date)} · ${data.sets.length} saved set records</div>
 <div class="nextMove"><b>Full workout prescription (including timing and instructions)</b><div class="meta workoutLine">${esc(p.workout_details)}</div></div>
 <div class="meta"><b>Warm-up:</b> ${esc(p.instructions.warmup)}</div>
 <div class="meta"><b>Between sets:</b> ${esc(p.instructions.rest)}</div>
 <div class="meta"><b>Cool-down:</b> ${esc(p.instructions.cooldown)}</div>
 ${p.exercises.map((ex,exIndex)=>`<div class="exercise"><h4>${exIndex+1}. ${esc(ex.name)} ${ex.optional?'<small class="meta">(optional)</small>':''}</h4>
 ${ex.sets.map(set=>{
 const old=saved.get(ex.name+'|'+set.set)||{};
 return `<div class="setGrid" data-set-row="${exIndex}:${set.set}">
 <div class="meta"><b>Set ${set.set}</b><div>Target: ${esc(set.target_reps)}</div><div>Rest: ${esc(set.rest_seconds)} sec</div></div>
 ${input(exIndex,set.set,'weight_lb',old.weight_lb,'0')}
 ${input(exIndex,set.set,'reps',old.reps,set.target_reps)}
 ${input(exIndex,set.set,'duration_minutes',old.duration_minutes,'0')}
 ${input(exIndex,set.set,'rpe',old.rpe,'1–10')}
 <button class="primary" data-save-set="${exIndex}:${set.set}">${old.id?'Update':'Save'} set</button>
 <div style="grid-column:1/-1">${input(exIndex,set.set,'notes',old.notes||'','Optional notes')}</div>
 ${old.id?`<div class="savedSet" style="grid-column:1/-1">✓ Previously logged ${esc(old.updated_at||'')}</div>`:''}
 </div>`;
 }).join('')}</div>`).join('')}
 <div class="meta">Log each set as you go. Saving a weight/reps entry does not automatically mark the entire workout complete; use the task's Complete button after finishing the prescribed session.</div>`;
 el.querySelectorAll('[data-save-set]').forEach(b=>b.addEventListener('click',()=>saveWorkoutSet(taskId,p,b)));
}
async function saveWorkoutSet(taskId,plan,button){
 const [exIndex,setNumber]=button.dataset.saveSet.split(':').map(Number);
 const exercise=plan.exercises[exIndex]?.name;
 const row=button.closest('[data-set-row]');
 const get=f=>row.querySelector('[data-field="'+f+'"]').value.trim();
 const body={task_id:taskId,exercise,set_number:setNumber};
 for(const f of ['weight_lb','reps','duration_minutes','rpe','notes'])body[f]=get(f)===''?null:get(f);
 button.disabled=true;button.textContent='Saving…';
 try{
  const response=await fetch(WORKOUT_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const data=await response.json();
  if(!response.ok)throw Error(data.error||'Unable to log set');
  setStatus('Workout set recorded in Kay Command ✓');
  await loadWorkout(taskId);
 }catch(e){setStatus(e.message);button.disabled=false;button.textContent='Retry saving set'}
}
async function load(){setStatus('Loading live project view…');FEED=await callApi();render();setStatus(`Live as of ${new Date(FEED.generated_at).toLocaleTimeString()}`)}
async function runAction(id,type,action,extra={}){try{setStatus('Saving change…');await callApi('PATCH',{task_id:id,task_type:type,action,...extra});await load();setStatus('Saved to Kay Command ✓')}catch(e){setStatus(e.message)}}
async function createTask(){const task_name=$('newName').value.trim(),project_id=$('newProject').value,due_date=$('newDate').value||null,details=$('newDetails').value.trim()||null;if(!task_name)return setStatus('Enter a task name.');try{setStatus('Creating task…');await callApi('POST',{task_name,project_id,due_date,details});$('newName').value='';$('newDate').value='';$('newDetails').value='';await load();setStatus('Task created in Kay Command ✓')}catch(e){if(e.data?.duplicate)setStatus(`Duplicate blocked: "${e.data.duplicate.name}" already exists.`);else setStatus(e.message)}}
$('refresh').addEventListener('click',()=>load().catch(e=>setStatus(e.message)));
$('createTask').addEventListener('click',createTask);
load().catch(e=>setStatus('Unable to load the live task list: '+e.message));
</script>
</body>
</html>
